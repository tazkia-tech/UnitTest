<text x="135" y="168" font-size="15" fill="#1C2B4A" text-anchor="middle">register "alice", "bob",</text>
<text x="135" y="190" font-size="15" fill="#1C2B4A" text-anchor="middle">"charlie", "eve", ...</text>
<polygon points="252,147 300,147 300,135 328,155 300,175 300,163 252,163" fill="#3B6FD8"/>

<polygon points="340,155 490,75 640,155 490,235" fill="#DCE8FB" stroke="#3B6FD8" stroke-width="2.5"/>
<text x="490" y="148" font-size="19" font-weight="700" fill="#1C2B4A" text-anchor="middle">Ada @patch</text>
<text x="490" y="174" font-size="19" font-weight="700" fill="#1C2B4A" text-anchor="middle">DB_PATH?</text>

<line x1="645" y1="155" x2="728" y2="155" stroke="#3E9B2F" stroke-width="6" marker-end="url(#mg)"/>
<text x="686" y="140" font-size="20" font-weight="700" fill="#3E9B2F" text-anchor="middle">Ya</text>
<rect x="745" y="90" width="190" height="130" rx="14" fill="#E3F4DD" stroke="#5DAE4B" stroke-width="2.5"/>
<text x="840" y="125" font-size="16" font-weight="700" fill="#1F4D17" text-anchor="middle" font-family="Menlo, Consolas, monospace">test_users_db</text>
<text x="840" y="145" font-size="16" font-weight="700" fill="#1F4D17" text-anchor="middle" font-family="Menlo, Consolas, monospace">.json</text>
<text x="840" y="173" font-size="15" fill="#1F4D17" text-anchor="middle">file sementara,</text>
<text x="840" y="195" font-size="15" fill="#1F4D17" text-anchor="middle">dihapus tearDown</text>

<line x1="490" y1="239" x2="490" y2="293" stroke="#C9302C" stroke-width="6" marker-end="url(#mr)"/>
<text x="502" y="273" font-size="20" font-weight="700" fill="#C9302C">Tidak</text>
<rect x="370" y="310" width="240" height="100" rx="14" fill="#FBE3E3" stroke="#D9534F" stroke-width="2.5"/>
<text x="490" y="345" font-size="17" font-weight="700" fill="#7A1C19" text-anchor="middle" font-family="Menlo, Consolas, monospace">users_db.json</text>
<text x="490" y="372" font-size="15" fill="#7A1C19" text-anchor="middle">data ASLI tercampur</text>
<text x="490" y="394" font-size="15" fill="#7A1C19" text-anchor="middle">alice, bob, eve, ...</text>

<line x1="840" y1="224" x2="840" y2="293" stroke="#3E9B2F" stroke-width="6" marker-end="url(#mg)"/>
<rect x="745" y="310" width="190" height="100" rx="14" fill="#E3F4DD" stroke="#5DAE4B" stroke-width="2.5"/>
<text x="840" y="345" font-size="19" font-weight="700" fill="#1F4D17" text-anchor="middle">Run 1: OK</text>
<text x="840" y="372" font-size="19" font-weight="700" fill="#1F4D17" text-anchor="middle">Run 2: OK</text>
<text x="840" y="396" font-size="14" fill="#1F4D17" text-anchor="middle">selalu mulai dari nol</text>

<line x1="490" y1="414" x2="490" y2="438" stroke="#C9302C" stroke-width="6" marker-end="url(#mr)"/>
<rect x="370" y="452" width="240" height="56" rx="14" fill="#FBE3E3" stroke="#D9534F" stroke-width="2.5"/>
<text x="490" y="476" font-size="17" font-weight="700" fill="#7A1C19" text-anchor="middle">Run 1: OK</text>
<text x="490" y="498" font-size="17" font-weight="700" fill="#7A1C19" text-anchor="middle">Run 2: FAIL ✗</text>

<rect x="30" y="250" width="310" height="258" rx="12" fill="#FFF8E6" stroke="#F0D08A"/>
<text x="46" y="280" font-size="16" font-weight="700" fill="#7A5A00">Kenapa Run 2 FAIL?</text>
<text x="46" y="310" font-size="15" fill="#5C4500">Run 1 menulis "alice" ke</text>
<text x="46" y="332" font-size="15" fill="#5C4500">users_db.json (data asli).</text>
<text x="46" y="362" font-size="15" fill="#5C4500">setUp/tearDown hanya</text>
<text x="46" y="384" font-size="15" fill="#5C4500">menghapus test_users_db.json,</text>
<text x="46" y="406" font-size="15" fill="#5C4500">jadi "alice" tetap tersimpan.</text>
<text x="46" y="436" font-size="15" fill="#5C4500">Run 2 register "alice" lagi</text>
<text x="46" y="458" font-size="15" fill="#5C4500">→ "Username sudah terdaftar"</text>
<text x="46" y="480" font-size="15" fill="#5C4500">→ False is not true</text>
