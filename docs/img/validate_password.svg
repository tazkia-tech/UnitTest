<text x="135" y="200" font-size="22" font-weight="700" fill="#1C2B4A" text-anchor="middle" font-family="Menlo, Consolas, 'Courier New', monospace">&quot;12345&quot;</text>
<polygon points="252,167 300,167 300,155 328,175 300,195 300,183 252,183" fill="#3B6FD8"/>
<polygon points="340,175 490,90 640,175 490,260" fill="#DCE8FB" stroke="#3B6FD8" stroke-width="2.5"/>
<text x="490" y="168" font-size="19" font-weight="700" fill="#1C2B4A" text-anchor="middle">String dan</text>
<text x="490" y="194" font-size="19" font-weight="700" fill="#1C2B4A" text-anchor="middle">panjang ≥ 6?</text>
<line x1="645" y1="175" x2="728" y2="175" stroke="#B0B7C3" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#mg)"/>
<text x="686" y="160" font-size="20" font-weight="700" fill="#B0B7C3" text-anchor="middle">Ya</text>
<rect x="745" y="110" width="190" height="130" rx="14" fill="#F3F5F8" stroke="#B0B7C3" stroke-width="2.5"/>
<text x="840" y="160" font-size="21" font-weight="700" fill="#8A93A3" text-anchor="middle">Return True</text>
<text x="840" y="190" font-size="18" fill="#8A93A3" text-anchor="middle">(Valid)</text>
<text x="840" y="214" font-size="15" fill="#8A93A3" text-anchor="middle">password diterima</text>
<line x1="490" y1="264" x2="490" y2="318" stroke="#C9302C" stroke-width="6" marker-end="url(#mr)"/>
<text x="502" y="298" font-size="20" font-weight="700" fill="#C9302C">Tidak</text>
<rect x="370" y="335" width="240" height="88" rx="14" fill="#FBE3E3" stroke="#D9534F" stroke-width="2.5"/>
<text x="490" y="368" font-size="21" font-weight="700" fill="#7A1C19" text-anchor="middle">Return False</text>
<text x="490" y="393" font-size="17" fill="#7A1C19" text-anchor="middle">(Tidak Valid)</text>
<text x="490" y="413" font-size="14" fill="#7A1C19" text-anchor="middle">password ditolak</text>
<rect x="30" y="285" width="310" height="138" rx="12" fill="#F5F7FA" stroke="#D5DBE5"/>
<text x="46" y="311" font-size="15" font-weight="700" fill="#4A5568">Kode:</text>
<text x="46" y="338" font-size="14" fill="#1C2B4A" font-family="Menlo, Consolas, 'Courier New', monospace">isinstance(password, str)</text>
<text x="46" y="360" font-size="14" fill="#1C2B4A" font-family="Menlo, Consolas, 'Courier New', monospace">and len(password) &gt;= 6</text>
<rect x="635" y="285" width="300" height="138" rx="12" fill="#FFF8E6" stroke="#F0D08A"/>
<text x="651" y="315" font-size="16" font-weight="700" fill="#7A5A00">Kenapa &quot;12345&quot; → False?</text>
<text x="651" y="345" font-size="15" fill="#5C4500">&quot;12345&quot; hanya 5 karakter,</text>
<text x="651" y="370" font-size="15" fill="#5C4500">kurang dari minimal 6.</text>
<text x="651" y="405" font-size="13" fill="#8A6D1F">Panah tebal = jalur yang dilalui</text>
